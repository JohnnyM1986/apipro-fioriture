# Scarica lo storico meteo ERA5-Land 1991-2025 (Open-Meteo), calcola le soglie e la verifica a ritroso.
# Il piano gratuito di Open-Meteo ha un limite giornaliero: lo scarico riprende da dove si era fermato
# a ogni esecuzione e i dati vengono salvati nel repository (model/data, model/output).
# Quando lo storico è completo, le esecuzioni successive ricalcolano solo soglie e verifica (pochi secondi).
name: Modello – storico, soglie e verifica

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # ogni 3 ore finché lo storico non è completo [DA VERIFICARE: ridurre a settimanale dopo]
  push:
    branches: [main]
    paths: ['config/species.yaml', 'config/points.yaml', 'model/apipro_model/**', 'model/run.py']

permissions:
  contents: write

concurrency:
  group: model-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: pip install -r model/requirements.txt
      - run: python -m pytest -q model/tests
      - run: python model/run.py fetch-history
      - run: python model/run.py calibrate
      - run: python model/run.py hindcast
      - name: Salva dati e risultati nel repository
        run: |
          git config user.name "apipro-bot"
          git config user.email "apipro-bot@users.noreply.github.com"
          git add model/data model/output
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Modello: aggiornamento storico meteo, soglie e verifica a ritroso [automatico]"
          git pull --rebase
          git push
