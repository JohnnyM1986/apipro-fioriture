# Pubblica la versione di prova della WebApp su GitHub Pages a ogni modifica del ramo main.
name: Pubblica WebApp (test)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Database di TEST (chiave pubblica, pensata per il browser; la sicurezza è nelle regole del database)
          VITE_SUPABASE_URL: https://bxwmpnkkasukhfmqffii.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_NX0mAQImAbAFz3yz5a8TzA_ORyH9d-9
          VITE_ENV_LABEL: TEST
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
