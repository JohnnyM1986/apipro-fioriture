# Pubblica la versione di prova della WebApp su GitHub Pages a ogni modifica del ramo main
# e ogni notte, dopo aver ricalcolato le previsioni di fioritura (app/public/data/predictions.json).
name: Pubblica WebApp (test)

on:
  push:
    branches: [main]
    paths: ['app/**', 'model/**', 'config/**', '.github/workflows/deploy-pages.yml']
  schedule:
    - cron: '30 2 * * *'   # ogni notte alle 03:30 ora italiana (inverno)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Previsioni di fioritura (Open-Meteo + soglie in gradi giorno)
        working-directory: .
        continue-on-error: true   # se il servizio meteo non risponde, l'app si pubblica comunque
        timeout-minutes: 20
        run: |
          pip install -r model/requirements.txt
          python -m pytest -q model/tests
          python model/run.py forecast
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Database di TEST (chiave pubblica, pensata per il browser; la sicurezza è nelle regole del database)
          VITE_SUPABASE_URL: https://bxwmpnkkasukhfmqffii.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_NX0mAQImAbAFz3yz5a8TzA_ORyH9d-9
          VITE_ENV_LABEL: TEST
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
